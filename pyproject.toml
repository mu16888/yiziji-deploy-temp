[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-monetization-template"
version = "0.1.0"
description = "Reusable AI-tool monetization template (FastAPI + Jinja2 + SQLite/Postgres)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic-settings",
    "alembic",
    "pytest",
    "httpx",
    "jinja2",
    "python-multipart",
    "pypdf",
    "python-docx",
    "python-pptx",
]

[tool.setuptools.packages.find]
# Explicit discovery: the repo also has docs/, static/, templates/, tests/ top-level
# folders, which setuptools auto-discovery would reject as ambiguous.
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
