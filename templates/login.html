<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 / 注册 · AI 互动课堂</title>
  <style>
    body { font-family: system-ui, sans-serif; background: radial-gradient(900px 360px at 50% -10%, #fff 0%, #F7F4EC 62%); background-color: #F7F4EC; margin: 0; display: grid; place-items: center; min-height: 100vh; color: #1F2933; }
    .card { background: #fff; padding: 32px; border: 1px solid rgba(15,42,71,.12); border-top: 3px solid #C9A227; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,42,71,.12); width: 320px; }
    h1 { font-size: 20px; margin: 0 0 20px; color: #0F2A47; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; color: #1F2933; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid rgba(15,42,71,.16); border-radius: 6px; background: #fff; color: #1F2933; }
    input:focus { outline: none; border-color: #C9A227; box-shadow: 0 0 0 3px rgba(201,162,39,.22); }
    button { width: 100%; margin-top: 20px; padding: 11px; border: 1px solid #C9A227; border-radius: 6px; background: #0F2A47; color: #E8D08D; font-size: 15px; cursor: pointer; }
    button:hover { background: #1B3E5C; color: #fff; }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #c0392b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>登录 / 注册</h1>
    <form id="auth-form">
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="tel" value="" placeholder="13800000001" required>

      <label for="code">验证码</label>
      <input id="code" name="code" type="text" placeholder="开发期固定 123456" required>

      <label for="referrer">邀请码（可选）</label>
      <input id="referrer" name="referrer" type="text" placeholder="TCH-8F3K">

      <button type="submit">登录 / 注册</button>
      <p class="msg" id="msg"></p>
    </form>
  </main>
  <script src="/static/app.js"></script>
  <script>
    // Read CSRF from the cookie, never a stale meta tag: register/login rotate it.
    // A shared invite link (/login?ref=CODE) pre-fills the invite code.
    const ref = new URLSearchParams(window.location.search).get('ref');
    if (ref) document.getElementById('referrer').value = ref;
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        phone: document.getElementById('phone').value.trim(),
        code: document.getElementById('code').value.trim(),
        referrer: document.getElementById('referrer').value.trim() || null,
      };
      const msg = document.getElementById('msg');
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': window.csrfToken()},
          body: JSON.stringify(body),
        });
        const data = await r.json();
        msg.style.color = r.ok ? '#1a7f37' : '#c0392b';
        msg.textContent = r.ok ? '登录成功，欢迎回来！' : (data.detail || '登录失败');
        if (r.ok) {
          window.location.href = '/workbench';
        }
      } catch (err) {
        msg.textContent = '网络错误';
      }
    });
  </script>
</body>
</html>
