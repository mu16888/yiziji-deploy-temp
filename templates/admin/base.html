<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理后台{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1F2933; background: #F7F4EC; }
    h1 { color: #0F2A47; }
    nav a { margin-right: 1rem; color: #0F2A47; }
    nav a:hover { color: #C9A227; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid rgba(15,42,71,.14); padding: .4rem .6rem; text-align: left; }
    th { background: #E8D08D; color: #0F2A47; }
    .cards { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .card { border: 1px solid rgba(15,42,71,.14); border-top: 2px solid #C9A227; border-radius: 6px; padding: 1rem 1.5rem; background: #fff; }
    .card b { display: block; font-size: 1.4rem; color: #0F2A47; }
  </style>
</head>
<body>
  <h1>管理后台</h1>
  <nav>
    <a href="/admin">统计看板</a>
    <a href="/admin/ui/orders">订单</a>
    <a href="/admin/ui/products">商品</a>
    <a href="/admin/ui/withdrawals">提现审核</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
