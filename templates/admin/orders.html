{% extends "admin/base.html" %}
{% block title %}订单 · 管理后台{% endblock %}
{% block content %}
<h2>订单</h2>
<table>
  <thead><tr><th>订单号</th><th>用户</th><th>SKU</th><th>金额（分）</th><th>实付（分）</th><th>状态</th></tr></thead>
  <tbody>
  {% for o in orders %}
    <tr>
      <td>{{ o.no }}</td><td>{{ o.user_id }}</td><td>{{ o.sku }}</td>
      <td>{{ o.amount_fen }}</td><td>{{ o.paid_amount_fen or '' }}</td><td>{{ o.status }}</td>
    </tr>
  {% else %}
    <tr><td colspan="6">暂无订单</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
