# 反向代理配置；由 docker-compose 挂载到 nginx 容器的
# /etc/nginx/conf.d/default.conf。单独部署时可直接放进 conf.d/。
server {
    listen 80;
    server_name _;

    # 备课资料上传（PPT/PDF/文档）需要放宽请求体上限。
    client_max_body_size 20m;

    # 静态资源由 nginx 直接提供（docker-compose 把 ./static 只读挂到 /var/www/static）。
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查：供宿主机 curl /health 与负载均衡探活。
    location /health {
        proxy_pass http://app:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 其余请求（页面 + /api/*）交给 uvicorn。Web 通道依赖下游设置的
    # httpOnly Cookie，必须把客户端真实协议/地址透传， CSRF 才能正确判定。
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
